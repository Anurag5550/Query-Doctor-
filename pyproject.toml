[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "query-doctor"
version = "0.1.0"
description = "PostgreSQL EXPLAIN ANALYZE diagnostics from the command line"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Query Doctor Contributors" }]
license = { file = "LICENSE" }
keywords = ["postgresql", "explain", "performance", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: System :: Monitoring",
]

dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.0,<14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.0",
]

[project.scripts]
query-doctor = "query_doctor.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pre-commit]
repos = [
  { repo = "https://github.com/astral-sh/ruff-pre-commit", rev = "v0.6.9", hooks = ["ruff", "ruff-format"] },
  { repo = "https://github.com/pre-commit/pre-commit-hooks", rev = "v4.4.0", hooks = ["trailing-whitespace", "end-of-file-fixer", "check-yaml", "check-merge-conflict"] },
]
